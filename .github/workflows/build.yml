name: Build papers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Needed so the PR-comment step can post the artifact link.
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # DOCX/ODT reference templates are stored in git-lfs; without this the
          # checkout leaves LFS pointer files and pandoc fails the DOCX/ODT build
          # ("Did not find end of central directory signature").
          lfs: true

      - name: Install LaTeX, fonts, and SVG support
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended fonts-dejavu \
            librsvg2-bin

      - name: Install Pandoc and pandoc-crossref (matching versions)
        run: |
          # pandoc-crossref v0.3.25a is built against Pandoc 3.11 — pin both.
          PANDOC_VERSION=3.11
          CROSSREF_TAG=v0.3.25a
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          curl -fsSL -o /tmp/crossref.tar.xz \
            "https://github.com/lierdakil/pandoc-crossref/releases/download/${CROSSREF_TAG}/pandoc-crossref-Linux-X64.tar.xz"
          sudo tar -xf /tmp/crossref.tar.xz -C /usr/local/bin pandoc-crossref
          sudo chmod +x /usr/local/bin/pandoc-crossref
          pandoc --version | head -1
          pandoc-crossref --version

      - name: List papers
        run: make list

      - name: Build all papers
        run: make all

      - name: Upload built documents
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: papers
          path: papers/*/public/*
          if-no-files-found: warn

      - name: Comment PDF artifact link on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.upload.outputs.artifact-url }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '📄 **Built documents** for this PR are ready.',
              '',
              url
                ? `Download the \`papers\` artifact: ${url}`
                : `See the run for artifacts: ${runUrl}`,
              '',
              '_Artifacts expire per repo retention settings._',
            ].join('\n');
            const marker = '<!-- pdf-artifact-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const finalBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: finalBody,
              });
            }
