" points="796,403.0234,806,407.0234,796,411.0234,800,407.0234" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="601" x2="802" y1="407.0234" y2="407.0234"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="100" x="608" y="386.8247">round-trip тест</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="183" x="608" y="401.9575">(apply → rollback → re-apply)</text><polygon fill="#A80036" points="350,432.1563,340,436.1563,350,440.1563,346,436.1563" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="344" x2="600" y1="436.1563" y2="436.1563"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="142" x="356" y="431.0903">извештај о исправци</text><polygon fill="#A80036" points="98,461.2891,88,465.2891,98,469.2891,94,465.2891" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="92" x2="338" y1="465.2891" y2="465.2891"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="182" x="104" y="460.2231">поновно покретање теста</text><polygon fill="#A80036" points="796,490.4219,806,494.4219,796,498.4219,800,494.4219" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="87" x2="802" y1="494.4219" y2="494.4219"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="134" x="94" y="489.356">интеграциони тест</text><polygon fill="#A80036" points="98,519.5547,88,523.5547,98,527.5547,94,523.5547" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="92" x2="807" y1="523.5547" y2="523.5547"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="64" x="104" y="518.4888">резултат</text><path d="M13,545.5547 L77,545.5547 L77,552.5547 L67,562.5547 L13,562.5547 L13,545.5547 " fill="#EEEEEE" style="stroke: #000000; stroke-width: 1.0;"/><rect fill="none" height="105.3359" style="stroke: #000000; stroke-width: 2.0;" width="638.5" x="13" y="545.5547"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="19" x="28" y="558.6216">alt</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="95" x="92" y="557.7651">[тест пролази]</text><polygon fill="#A80036" points="327,579.8203,337,583.8203,327,587.8203,331,583.8203" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="87" x2="333" y1="583.8203" y2="583.8203"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="44" x="94" y="578.7544">GREEN</text><line style="stroke: #000000; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="13" x2="651.5" y1="592.8203" y2="592.8203"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="251" x="18" y="603.0308">[после 3 итерације тест и даље пада]</text><polygon fill="#A80036" points="350,638.8906,340,642.8906,350,646.8906,346,642.8906" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="344" x2="600" y1="642.8906" y2="642.8906"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="237" x="356" y="622.6919">заустављање и пуна дијагностика</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="238" x="356" y="637.8247">(препорука за ручну интервенцију)</text><!--MD5=[f94481a491150a585a32324f3f819972]
@startuml
skinparam defaultFontName "DejaVu Sans"
skinparam shadowing false

participant "TDD/BDD агент" as tdd
actor "Програмер" as dev
participant "DB агент" as db
database "PostgreSQL" as pg

tdd -> pg : покреће интеграциони тест
pg - -> tdd : грешка шеме (нпр. column does not exist)
tdd -> dev : структурисани извештај\n(назив теста, порука, stack trace)
note right of dev : Агенти не комуницирају\nдиректно — програмер\nручно прослеђује извештај
dev -> db : прослеђује извештај

loop највише 3 итерације
  db -> db : класификација грешке и\nкорекциона миграција
  db -> pg : round-trip тест\n(apply → rollback → re-apply)
  db -> dev : извештај о исправци
  dev -> tdd : поновно покретање теста
  tdd -> pg : интеграциони тест
  pg - -> tdd : резултат
end

alt тест пролази
  tdd -> dev : GREEN
else после 3 итерације тест и даље пада
  db -> dev : заустављање и пуна дијагностика\n(препорука за ручну интервенцију)
end
@enduml

